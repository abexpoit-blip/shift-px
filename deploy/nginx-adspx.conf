# /etc/nginx/sites-available/adspx
# Cloudflare (orange cloud) → VPS Hybrid Stack
# Cloudflare hides VPS IP. Our nginx WAF handles bot detection + load balancing.
# Real visitor IPs come via CF-Connecting-IP header (restored below).

# ─── Rate Limiting Zones ──────────────────────────────────────────────────────
# Use CF-Connecting-IP when behind Cloudflare (the real client IP, not CF edge).
limit_req_zone $http_cf_connecting_ip zone=flood_guard:20m rate=60r/s;
limit_req_zone $http_cf_connecting_ip zone=bot_protect:10m rate=15r/s;
limit_conn_zone $http_cf_connecting_ip zone=conn_limit:20m;

upstream adspx_backend {
    least_conn;
    server 127.0.0.1:4000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4002 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4003 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4004 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4005 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4006 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4007 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4008 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4009 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4010 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4011 max_fails=3 fail_timeout=10s;
    keepalive 256;
}

# ─── HTTP → HTTPS ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_tokens off;
    server_name adspx.com www.adspx.com adswapx.com www.adswapx.com linkfly.link www.linkfly.link pxclick.me www.pxclick.me urlshift.co www.urlshift.co _;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ─── HTTPS Main Server ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name adspx.com www.adspx.com adswapx.com www.adswapx.com linkfly.link www.linkfly.link pxclick.me www.pxclick.me urlshift.co www.urlshift.co _;

    # ssl_certificate     /etc/letsencrypt/live/adswapx.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/adswapx.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ─── IP Masking + Security Headers ───────────────────────────────────────
    server_tokens off;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Runtime;
    proxy_hide_header X-Version;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS — required for European/GDPR trust signals. 1-year, include subdomains.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ─── Cloudflare Real IP Restoration ──────────────────────────────────────
    # Cloudflare edge IPs — full list: https://www.cloudflare.com/ips/
    # After set_real_ip_from, $remote_addr = real visitor IP, not CF edge IP.
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ─── Proxy Headers → Node ────────────────────────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    # CF geo headers — zero-latency country detection in our bot engine
    proxy_set_header CF-IPCountry      $http_cf_ipcountry;
    proxy_set_header X-Country-Code    $http_cf_ipcountry;
    proxy_set_header CF-Ray            $http_cf_ray;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ─── Timeouts + Buffers (12-core 48GB VPS) ───────────────────────────────
    client_max_body_size 12m;
    client_body_buffer_size 128k;
    proxy_buffers 16 32k;
    proxy_buffer_size 64k;
    proxy_busy_buffers_size 128k;
    proxy_connect_timeout 4s;
    proxy_send_timeout    15s;
    proxy_read_timeout    15s;
    proxy_next_upstream error timeout http_502 http_503 http_504;

    # ─── Static Assets ───────────────────────────────────────────────────────
    location /_build/ {
        proxy_pass http://adspx_backend;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ─── Redirect Path — Tighter Bot Guard ───────────────────────────────────
    location /r/ {
        limit_req zone=bot_protect burst=20 nodelay;
        limit_conn conn_limit 20;
        proxy_pass http://adspx_backend;
    }

    # ─── Supabase Gateway (HTTPS Reverse Proxy) ──────────────────────────────
    location /supabase/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Main Gateway ─────────────────────────────────────────────────────────
    location / {
        limit_req zone=flood_guard burst=50 nodelay;
        limit_conn conn_limit 40;
        proxy_pass http://adspx_backend;
    }
}

