# /etc/nginx/sites-available/supabase
# Self-hosted Supabase API gateway (docker) exposed at supabase.adspx.com
# HTTP-only bootstrap: run certbot AFTER this is live.
#   certbot --nginx -d supabase.adspx.com

server {
    listen 80;
    listen [::]:80;
    server_name supabase.adspx.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    client_max_body_size 50m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        # supabase docker gateway (envoy/kong) published on 8000
        proxy_pass http://127.0.0.1:8000;
    }
}
