# /etc/nginx/sites-available/adspx  (HTTP-only bootstrap)
# Use this FIRST, before any certificate exists. Run:
#   certbot --nginx -d adspx.com -d www.adspx.com -d adswapx.com -d www.adswapx.com
# Certbot will add the 443 server block + ssl_certificate lines itself.

upstream adspx_backend {
    least_conn;
    server 127.0.0.1:4000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4002 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4003 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4004 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4005 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4006 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4007 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name adspx.com www.adspx.com adswapx.com www.adswapx.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    client_max_body_size 12m;

    # real visitor IP + host must survive the proxy hop (bot filter reads these)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    proxy_next_upstream error timeout http_502 http_503 http_504;

    location /_build/ {
        proxy_pass http://adspx_backend;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://adspx_backend;
    }
}
