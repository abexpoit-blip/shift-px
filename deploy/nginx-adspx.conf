# /etc/nginx/sites-available/adspx
# Adspx — main SaaS domain (adspx.com) + shortener domain (adswapx.com)
# Both hosts hit the same Node upstream; the app decides what to serve by Host.

upstream adspx_backend {
    least_conn;
    server 127.0.0.1:4000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4002 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4003 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4004 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4005 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4006 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4007 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# ---------- HTTP -> HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name adspx.com www.adspx.com adswapx.com www.adswapx.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- HTTPS (both domains) ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name adspx.com www.adspx.com adswapx.com www.adswapx.com;

    # certbot fills these in (--nginx). Keep the paths it writes.
    # ssl_certificate     /etc/letsencrypt/live/adspx.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/adspx.com/privkey.pem;

    client_max_body_size 12m;

    # real visitor IP + host must survive the proxy hop:
    # the bot filter reads these headers.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    proxy_next_upstream error timeout http_502 http_503 http_504;

    # static build assets — long cache
    location /_build/ {
        proxy_pass http://adspx_backend;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://adspx_backend;
    }
}
